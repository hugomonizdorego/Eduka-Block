<?xml version="1.0" encoding="UTF-8"?>
<!-- Eduka-Block logo: a shield (protection) holding an open book (education),
     crossed by a check mark (safe browsing). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Eduka-Block</title>
  <defs>
    <filter id="shield-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b4f99" flood-opacity=".22"/>
    </filter>
    <filter id="check-glow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2fb344" flood-opacity=".30"/>
    </filter>
    <!-- Clears a transparent gap around the check so it reads on any background. -->
    <mask id="check-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <path d="M88 168 L120 200 L212 108" fill="none" stroke="#000" stroke-width="46"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#check-gap)" filter="url(#shield-shadow)">
    <path d="M76 190 C56 160 44 124 44 72 C80 70 106 58 128 38 C150 58 176 70 212 72 C212 96 210 116 204 134"
          fill="none" stroke="#0b5cad" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0b5cad">
      <path d="M123 88 C107 78 89 76 72 80 L72 130 C89 126 107 128 123 138 Z"/>
      <path d="M133 88 C149 78 167 76 184 80 L184 130 C167 126 149 128 133 138 Z"/>
    </g>
  </g>
  <path d="M88 168 L120 200 L212 108" fill="none" stroke="#2fb344" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#check-glow)"/>
</svg>
